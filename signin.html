<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sonaris — Sign in</title>
  <meta name="description" content="Sign in to Sonaris to upgrade your plan. Checkout is linked to your account." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <site-header active=""></site-header>
  <noscript><header class="site-head"><div class="wrap"><a class="brand" href="index.html"><img class="brand-mark" src="icons/logo.png" alt="" aria-hidden="true" />Sonaris</a><nav id="site-nav-noscript" aria-label="Primary"><a href="index.html">Home</a> <a href="pricing.html">Pricing</a> <a href="account.html">My account</a></nav></div></header></noscript>

  <main class="wrap">
    <section class="status-card" aria-live="polite">
      <!-- Shown while the page decides: Google return, existing session. -->
      <div id="signin-loading">
        <h1>Sign in to Sonaris</h1>
        <div class="spinner" aria-hidden="true"></div>
        <p>Checking your session…</p>
      </div>

      <div id="signin-form-wrap" hidden>
        <h1 id="signin-title">Sign in to continue</h1>
        <p id="signin-subtitle">Your upgrade is linked to this account — you can pay with any email.</p>
        <form id="signin-form" novalidate>
          <div id="signin-name-row" hidden>
            <label class="field">
              <span>First name</span>
              <input id="signin-firstname" type="text" autocomplete="given-name" />
            </label>
            <label class="field">
              <span>Last name</span>
              <input id="signin-lastname" type="text" autocomplete="family-name" />
            </label>
          </div>
          <label class="field">
            <span>Email</span>
            <input id="signin-email" type="email" required autocomplete="email" />
          </label>
          <label class="field" id="signin-password-row">
            <span>Password</span>
            <input id="signin-password" type="password" required autocomplete="current-password" minlength="6" />
          </label>
          <p id="signin-error" class="form-error" hidden></p>
          <div class="actions">
            <button id="signin-submit" class="btn btn-primary" type="submit">Sign in</button>
            <button id="signin-google" class="btn btn-ghost btn-google" type="button"><img src="icons/google.svg" alt="" aria-hidden="true" /> Continue with Google</button>
          </div>
        </form>
        <p class="switch-line" id="signin-switch-row">
          <span id="signin-toggle-message">Don't have an account?</span>
          <button id="signin-toggle" class="linklike" type="button">Sign Up</button>
        </p>
        <p class="switch-line" id="signin-forgot-row">
          <button id="signin-forgot" class="linklike" type="button">Forgot password?</button>
        </p>
        <p class="switch-line" id="signin-back-row" hidden>
          <button id="signin-back" class="linklike" type="button">← Back to sign in</button>
        </p>
      </div>

      <div id="signin-reset-sent" hidden>
        <h1><span class="ok">Check your inbox</span></h1>
        <p id="signin-reset-text">If an account exists for that email, a reset link is on its way.</p>
        <div class="actions">
          <button id="signin-reset-back" class="btn btn-ghost" type="button">Back to sign in</button>
        </div>
      </div>

      <div id="signin-done" hidden>
        <h1><span class="ok">Signed in</span></h1>
        <p id="signin-welcome"></p>
        <div class="actions">
          <button id="signin-continue" class="btn btn-primary" type="button">Continue</button>
        </div>
      </div>
    </section>
  </main>

  <site-footer variant="billing"></site-footer>

  <script src="site-config.js"></script>
  <script src="components.js"></script>
  <script src="auth.js"></script>
  <script src="signin.js"></script>
  <script src="nav.js"></script>
</body>
</html>
